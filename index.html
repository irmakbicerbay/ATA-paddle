<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATA Paddle</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
        radial-gradient(900px 500px at 50% 30%, rgba(255,122,36,.25), transparent 55%),
        radial-gradient(800px 400px at 70% 60%, rgba(56,189,248,.18), transparent 55%),
        #050816;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    #gameWrap{
      width:min(980px, 96vw);
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      gap:10px;
    }
    #game{ width:100%; display:flex; justify-content:center; }
    canvas{
      width:100% !important;
      height:auto !important;
      border-radius:18px;
      box-shadow:0 40px 100px rgba(0,0,0,.6);
      outline:none;
    }
    .hint{ color:#cbd5e1; font-size:13px; text-align:center; user-select:none; }
  </style>
</head>

<body>
  <div id="gameWrap">
    <div id="game"></div>
    <div class="hint">← → / A D : Move • SPACE : Launch/Restart • R : Restart</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

  <script>
    class GameScene extends Phaser.Scene {
      constructor(){
        super("game");
        this.paddle = null;
        this.ball = null;
        this.bricks = null;

        this.score = 0;
        this.lives = 3;
        this.isServing = true;
        this.gameEnded = false;

        this.scoreText = null;
        this.livesText = null;
        this.centerMsg = null;

        this.cursors = null;
        this.aKey = null;
        this.dKey = null;
        this.spaceKey = null;
        this.rKey = null;
      }

      init(){
        // Reset per-run state when the scene restarts.
        this.score = 0;
        this.lives = 3;
        this.isServing = true;
        this.gameEnded = false;
        this.scoreText = null;
        this.livesText = null;
        this.centerMsg = null;
      }

      create(){
        const W = this.scale.width;
        const H = this.scale.height;

        // bottom collision OFF so ball can fall
        this.physics.world.setBounds(0, 0, W, H);
        this.physics.world.setBoundsCollision(true, true, true, false);

        // ✅ Create explicit keys (most reliable)
        this.cursors = this.input.keyboard.createCursorKeys();
        this.aKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
        this.dKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
        this.rKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);

        // ✅ Prevent SPACE from scrolling / being eaten by the page
        this.input.keyboard.addCapture([
          Phaser.Input.Keyboard.KeyCodes.SPACE,
          Phaser.Input.Keyboard.KeyCodes.R
        ]);

        // Background
        this.add.rectangle(W/2, H/2, W, H, 0x050816);

        // Header
        this.add.rectangle(W/2, 34, W-40, 52, 0x0b1020, 0.75)
          .setStrokeStyle(1, 0x334155, 0.65);

        this.add.text(30, 20, "ATA Paddle", {
          fontSize:"18px",
          color:"#ff7a24",
          fontStyle:"900"
        });

        this.scoreText = this.add.text(30, 46, "Score: 0", { fontSize:"14px", color:"#cbd5e1" });
        this.livesText = this.add.text(W-30, 46, "❤ Lives: 3", { fontSize:"14px", color:"#cbd5e1" }).setOrigin(1,0);

        // Paddle
        this.paddle = this.add.rectangle(W/2, H-60, 150, 16, 0x38bdf8);
        this.paddle.setStrokeStyle(2, 0x7dd3fc, 0.6);
        this.physics.add.existing(this.paddle);
        this.paddle.body.setImmovable(true);
        this.paddle.body.setCollideWorldBounds(true);

        // Ball
        this.ball = this.add.circle(W/2, H-85, 9, 0xfbbf24);
        this.physics.add.existing(this.ball);
        this.ball.body.setBounce(1,1);
        this.ball.body.setCollideWorldBounds(true);

        // Bricks
        this.bricks = this.physics.add.staticGroup();
        this.createATABricks();

        // Collisions
        this.physics.add.collider(this.ball, this.paddle, this.hitPaddle, null, this);
        this.physics.add.collider(this.ball, this.bricks, this.hitBrick, null, this);

        // Start message (lower)
        this.showCenterText("PRESS SPACE TO START", 0xff7a24, 340);

        this.resetBallToPaddle();
      }

      createATABricks(){
        const A = [
          "0111110",
          "1100011",
          "1100011",
          "1111111",
          "1100011",
          "1100011",
          "1100011",
        ];
        const T = [
          "11111",
          "00100",
          "00100",
          "00100",
          "00100",
          "00100",
          "00100",
        ];

        const rows = 7;
        const gap = "00";
        const pattern = [];
        for (let r=0;r<rows;r++){
          pattern.push(A[r] + gap + T[r] + gap + A[r]);
        }

        const W = this.scale.width;
        const startY = 110;

        const cellW = 26, cellH = 18;
        const gapX = 7, gapY = 10;

        const cols = pattern[0].length;
        const totalW = cols*cellW + (cols-1)*gapX;
        const baseX = (W - totalW) / 2;

        const colors = [0xff7a24, 0x60a5fa, 0xa78bfa, 0xf43f5e, 0x22c55e, 0x60a5fa, 0xff7a24];

        for (let r=0;r<pattern.length;r++){
          for (let c=0;c<pattern[r].length;c++){
            if (pattern[r][c] !== "1") continue;

            const x = baseX + c*(cellW+gapX) + cellW/2;
            const y = startY + r*(cellH+gapY) + cellH/2;

            const brick = this.add.rectangle(x, y, cellW, cellH, colors[r], 0.95);
            brick.setStrokeStyle(2, 0xffffff, 0.14);
            this.physics.add.existing(brick, true);
            this.bricks.add(brick);
          }
        }
      }

      hitPaddle(ball, paddle){
        if (this.gameEnded) return;
        const diff = ball.x - paddle.x;
        ball.body.setVelocityX(diff * 6.5);
      }

      hitBrick(ball, brick){
        if (this.gameEnded) return;

        brick.destroy();
        this.score += 10;
        this.scoreText.setText("Score: " + this.score);

        if(this.bricks.countActive(true) === 0){
          this.gameEnded = true;
          this.ball.body.setVelocity(0,0);
          this.showCenterText("YOU CLEARED ATA! 🎉\nPress SPACE or R to restart", 0xf8fafc, 340);
        }
      }

      showCenterText(txt, colorInt, y = null){
        const W = this.scale.width, H = this.scale.height;
        this.centerMsg?.destroy();
        this.centerMsg = this.add.text(W/2, (y ?? H/2), txt, {
          fontSize:"30px",
          color: Phaser.Display.Color.IntegerToColor(colorInt).rgba,
          fontStyle:"900",
          align:"center"
        }).setOrigin(0.5);
      }

      resetBallToPaddle(){
        this.ball.body.setVelocity(0,0);
        this.ball.x = this.paddle.x;
        this.ball.y = this.paddle.y - 25;
      }

      loseLife(){
        this.lives--;
        this.livesText.setText("❤ Lives: " + this.lives);

        if(this.lives <= 0){
          this.gameEnded = true;
          this.ball.body.setVelocity(0,0);
          this.showCenterText("GAME OVER\nPress SPACE or R to restart", 0xf8fafc, 340);
          return;
        }

        this.isServing = true;
        this.showCenterText("PRESS SPACE TO CONTINUE", 0xff7a24, 340);
        this.resetBallToPaddle();
      }

      update(){
        // ✅ restart always
        if (Phaser.Input.Keyboard.JustDown(this.rKey)) {
          this.scene.restart();
          return;
        }

        // ✅ game ended: SPACE restarts
        if (this.gameEnded) {
          if (Phaser.Input.Keyboard.JustDown(this.spaceKey)) {
            this.scene.restart();
          }
          return;
        }

        const speed = 650;

        if(this.cursors.left.isDown || this.aKey.isDown){
          this.paddle.body.setVelocityX(-speed);
        } else if(this.cursors.right.isDown || this.dKey.isDown){
          this.paddle.body.setVelocityX(speed);
        } else {
          this.paddle.body.setVelocityX(0);
        }

        if(this.isServing){
          this.ball.x = this.paddle.x;
          this.ball.y = this.paddle.y - 25;

          if(Phaser.Input.Keyboard.JustDown(this.spaceKey)){
            this.centerMsg?.destroy();
            this.isServing = false;
            this.ball.body.setVelocity(
              Phaser.Math.Between(-220, 220),
              -360
            );
          }
        }

        if(!this.isServing){
          if(this.ball.y - this.ball.radius > this.scale.height + 5){
            this.loseLife();
          }
        }
      }
    }

    new Phaser.Game({
      type: Phaser.AUTO,
      parent: "game",
      width: 900,
      height: 520,
      backgroundColor: "#050816",
      physics: { default: "arcade", arcade: { gravity:{y:0}, debug:false } },
      scene: [GameScene]
    });
  </script>
</body>
</html>
